[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# gpui-kit re-exports GPUI (gpui-pre =0.3.11); never list gpui directly.
# `syntect`: syntax highlighting for CSS/JS/JSON responses and view-source:.
gpui-kit = { version = "0.9.0", features = ["syntect"] }
# cookies: a cookie jar (json: saving it); brotli: compressed responses;
# charset: pages that aren't UTF-8.
ureq = { version = "3", features = ["cookies", "json", "brotli", "charset"] }
anyhow = "1"
url = "2"
net = { path = "crates/net" }
html5ever = "0.40"
markup5ever = "0.40"
slotmap = "1"
page = { path = "crates/page" }
html = { path = "crates/html" }
style = { path = "crates/style" }
render = { path = "crates/render" }
js = { path = "crates/js" }

[profile.dev.package."*"]
# Dependencies (GPUI, the parser) are painfully slow unoptimized; our code stays debuggable.
opt-level = 2

# The engine crates do heavy per-page work; unoptimized they make dev builds feel broken.
[profile.dev.package.style]
opt-level = 2
[profile.dev.package.html]
opt-level = 2
[profile.dev.package.page]
opt-level = 2
[profile.dev.package.render]
opt-level = 2
[profile.dev.package.net]
opt-level = 2
[profile.dev.package.js]
opt-level = 2

# Boa's AST with a fix: `this` inside an arrow nested in another arrow
# reached the outer arrow's (lexical, so missing) binding, not the method's.
# See vendor/README.md.
[patch.crates-io]
boa_ast = { path = "vendor/boa_ast" }
boa_gc = { path = "vendor/boa_gc" }
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
taffy = { path = "vendor/taffy" }
