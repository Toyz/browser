[package]
name = "shell"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "feather"
path = "src/main.rs"

[dependencies]
# The global allocator: returns freed memory to the system and fragments
# less than the platform's (a page's script parse no longer leaves its peak
# behind).
mimalloc = { version = "0.1", default-features = false }
# Web fonts: WOFF/WOFF2 decoding (pure Rust) and reading their family names.
wuff = "0.2"
ttf-parser = "0.25"
# Variable fonts: GPUI draws them at their default instance only, so static
# instances are cut per weight (pure Rust zlib, no C).
allsorts = { version = "0.16", default-features = false, features = ["flate2_rust"] }
slotmap.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
url.workspace = true
net.workspace = true
html.workspace = true
render.workspace = true
style.workspace = true
page.workspace = true
js.workspace = true
futures = "0.3"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

# Only for `--features screenshot`: the same GPUI crates gpui-kit uses, with
# `test-support` switched on (which adds `Window::render_to_image`).
gpui-test-support = { package = "gpui-pre", version = "=0.3.11", optional = true, features = ["test-support"] }
gpui-platform-test-support = { package = "gpui-pre-platform", version = "=0.3.11", optional = true, features = ["test-support"] }

[features]
# `--screenshot out.png`: render the page offscreen to PNG and quit (dev/testing aid).
screenshot = ["dep:gpui-test-support", "dep:gpui-platform-test-support", "dep:image"]
