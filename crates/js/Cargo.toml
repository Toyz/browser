[package]
name = "js"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# intl_bundled: real Intl (ICU data compiled in); annex-b: the web-legacy
# parts pages still use (substr, escape, HTML comments in scripts).
# Native classes (Trace/Finalize derives), the vendored copy.
boa_gc = "0.22"
boa_engine = { version = "0.22", features = ["intl_bundled", "annex-b"] }
page.workspace = true
html.workspace = true
style.workspace = true
# TextDecoder: every encoding the Encoding Standard names.
encoding_rs = "0.8"
# The CSSOM's CSS text (rules, declarations), as the style engine tokenizes it.
cssparser = "0.38"
url.workspace = true
slotmap.workspace = true
anyhow.workspace = true
net.workspace = true
async-channel = "2"
# Image sizes for `new Image()` loads.
imagesize = "0.13"
avif.workspace = true
# <canvas> 2D: drawing, and decoding what drawImage draws.
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# crypto.subtle and getRandomValues (already in the tree through rustls).
ring = "0.17"
# WebSocket (rustls, like the rest of the network).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# The local time zone for Date (Boa's default gives up in multi-threaded
# programs and says UTC).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# <script type="importmap"> (already in the tree through boa).
serde_json = "1"


[dev-dependencies]
boa_ast = "0.22"
