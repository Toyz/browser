[package]
name = "render"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The version GPUI decodes with: we hand it pre-decoded frames (see images.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
slotmap.workspace = true
gpui-kit.workspace = true
page.workspace = true
style.workspace = true
url.workspace = true
anyhow.workspace = true
imagesize = "0.13"
# AVIF (still and animated), on every platform: libavif with libaom, built
# from source (needs CMake; NASM too on x86).
libavif-sys = { version = "0.17", default-features = false, features = ["codec-aom"] }
percent-encoding = "2"

[dev-dependencies]
net.workspace = true
html.workspace = true
